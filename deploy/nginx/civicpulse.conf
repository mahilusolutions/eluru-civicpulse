# CivicPulse — Nginx (domain, HTTPS added by certbot)
# Live: https://eluru.mahilusolutions.com
#
# Routes:
#   /        → React build
#   /api/    → CivicPulse API (PM2 :4000)
#   /ocr/    → OCR extraction tool (PM2 :2000), only for signed-in Super Admin / Admin
#
# Setup:  sudo bash deploy/setup-nginx.sh   (re-attaches HTTPS if a certificate already exists)

# Extra brake on password guessing, on top of the account lock-out inside the API.
limit_req_zone $binary_remote_addr zone=cp_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name eluru.mahilusolutions.com;

    root /var/www/eluru-civicpulse/civicpulse/build;
    index index.html;

    server_tokens off;
    client_max_body_size 50m;

    # Browser hardening
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /api/auth/login {
        limit_req zone=cp_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4000/api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # The API answers "is this person a signed-in Super Admin / Admin?" before anyone reaches the OCR tool.
    location = /_auth_ocr {
        internal;
        proxy_pass http://127.0.0.1:4000/api/auth/verify-ocr;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ocr/ {
        auth_request /_auth_ocr;
        error_page 401 403 = @ocr_denied;

        proxy_pass http://127.0.0.1:2000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location @ocr_denied {
        return 302 /login;
    }

    location = /ocr {
        return 302 /ocr/;
    }

    access_log /var/log/nginx/civicpulse.access.log;
    error_log  /var/log/nginx/civicpulse.error.log;
}

# Anything that reaches the server by its raw IP (or another name) goes to the real HTTPS site.
# Passwords must never travel over plain HTTP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://eluru.mahilusolutions.com$request_uri;
    }
}
