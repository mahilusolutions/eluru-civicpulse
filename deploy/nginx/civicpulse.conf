# CivicPulse — Nginx (domain + IP fallback)
# Live: https://eluru.mahilusolutions.com
#
# Routes:
#   /        → React build
#   /api/    → CivicPulse API (PM2 :4000)
#   /ocr/    → OCR extraction UI + API (PM2 :2000)

server {
    listen 80;
    listen [::]:80;
    server_name eluru.mahilusolutions.com;

    root /var/www/eluru-civicpulse/civicpulse/build;
    index index.html;

    server_tokens off;
    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /ocr/ {
        proxy_pass http://127.0.0.1:2000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location = /ocr {
        return 302 /ocr/;
    }

    access_log /var/log/nginx/civicpulse.access.log;
    error_log  /var/log/nginx/civicpulse.error.log;
}

# Raw IP still works (optional)
