# CivicPulse — Nginx site
# Install:
#   sudo cp deploy/nginx/civicpulse.conf /etc/nginx/sites-available/civicpulse
#   sudo ln -sfn /etc/nginx/sites-available/civicpulse /etc/nginx/sites-enabled/civicpulse
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Optional SSL (after DNS A-record points here):
#   sudo certbot --nginx -d your.domain.com

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Set to your domain when ready, e.g. civicpulse.example.com
    # server_name civicpulse.example.com;

    root /var/www/eluru-civicpulse/civicpulse/build;
    index index.html;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets
    location /static/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Backend API (PM2 / Node on localhost:4000)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # PDF / CSV uploads
    client_max_body_size 50m;

    access_log /var/log/nginx/civicpulse.access.log;
    error_log  /var/log/nginx/civicpulse.error.log;
}
